    - data:
        code: "function main({ text }) {\n    if (typeof text !== \"string\" || !text.trim())\
          \ {\n      throw new Error(\"需求提取输出为空，未执行商品查询\");\n    }\n    let data;\n\
          \    const raw = String(text).trim();\n    const unwrap = (value) => value.replace(/^```(?:json)?\\\
          s*/i, \"\").replace(/```\\s*$/i, \"\").trim();\n    const attempts = [raw,\
          \ unwrap(raw)];\n    const start = raw.indexOf(\"{\");\n    const end =\
          \ raw.lastIndexOf(\"}\");\n    if (start >= 0 && end > start) attempts.push(raw.slice(start,\
          \ end + 1));\n    const parseError = attempts.find((value) => {\n      try\
          \ {\n        data = JSON.parse(value);\n        return false;\n      } catch\
          \ {\n        return true;\n      }\n    });\n    if (parseError !== undefined)\
          \ {\n      throw new Error(\"需求提取输出不是合法 JSON，未执行商品查询\");\n    } \n    \n\
          \    if (!data || typeof data !== \"object\" || Array.isArray(data)) {\n\
          \      throw new Error(\"需求提取输出必须是 JSON 对象\");\n    }\n    const required\
          \ = [\"q\", \"intent\", \"category\", \"styleTags\", \"budgetCents\",\n\
          \      \"budgetScope\", \"includeCurrentProduct\", \"otherRequirements\"\
          , \"missingInformation\"];\n    for (const key of required) {\n      if\
          \ (!Object.prototype.hasOwnProperty.call(data, key)) {\n        throw new\
          \ Error(\"需求提取缺少字段：\" + key);\n      }\n    }\n    const allowed = [...required,\
          \ \"requestedCategories\", \"anchorProductId\",\"compareItems\"];\n    const\
          \ unknownFields = Object.keys(data).filter((key) => !allowed.includes(key));\n\
          \    if (unknownFields.length) {\n      throw new Error(\"需求提取包含未约定字段：\"\
          \ + unknownFields.join(\"、\"));\n    }\n    if (typeof data.q !== \"string\"\
          \ || data.q.length > 80) {\n      throw new Error(\"q 必须是最多 80 字符的检索词\"\
          );\n    }\n    const categories = [\"tops\", \"bottoms\", \"dresses\", \"\
          outerwear\", \"accessories\", \"shoes\"];\n    const enums = {\n      intent:\
          \ [\"search\", \"outfit\", \"similar\", \"product_info\", \"color_advice\"\
          , \"comparison\", \"unknown\"],\n      category: [...categories, \"\"],\n\
          \      budgetScope: [\"item\", \"total\", \"unknown\", \"none\"]\n    };\n\
          \    for (const key of Object.keys(enums)) {\n      if (!enums[key].includes(data[key]))\
          \ throw new Error(\"字段取值不合法：\" + key);\n    }\n    for (const key of [\"\
          styleTags\", \"otherRequirements\", \"missingInformation\"]) {\n      if\
          \ (!Array.isArray(data[key]) || data[key].some((v) => typeof v !== \"string\"\
          \ || !v.trim())) {\n        throw new Error(\"字段必须是非空字符串组成的数组：\" + key);\n\
          \      }\n    }\n    if (data.styleTags.length > 8 || data.styleTags.some((v)\
          \ => v.length > 50 || /[,，]/.test(v)) ||\n        data.styleTags.join(\"\
          ,\").length > 300) {\n      throw new Error(\"风格标签不符合商品接口格式\");\n    }\n\
          \    for (const key of [\"otherRequirements\", \"missingInformation\"])\
          \ {\n      if (data[key].length > 20 || data[key].some((v) => v.length >\
          \ 300)) {\n        throw new Error(\"需求条件过长：\" + key);\n      }\n    }\n\
          \    if (data.budgetCents !== null && (!Number.isSafeInteger(data.budgetCents)\
          \ || data.budgetCents < 0)) {\n      throw new Error(\"预算必须是非负整数分或 null\"\
          );\n    }\n    if ((data.budgetCents === null) !== (data.budgetScope ===\
          \ \"none\")) {\n      throw new Error(\"预算金额与预算范围不一致\");\n    }\n    if\
          \ (data.includeCurrentProduct !== null && typeof data.includeCurrentProduct\
          \ !== \"boolean\") {\n      throw new Error(\"includeCurrentProduct 必须是布尔值或\
          \ null\");\n    }\n    if (data.anchorProductId !== undefined && data.anchorProductId\
          \ !== null &&\n        (typeof data.anchorProductId !== \"string\" || !data.anchorProductId.trim()\
          \ || data.anchorProductId.length > 50)) {\n      throw new Error(\"anchorProductId\
          \ 必须是真实商品ID字符串或 null\");\n    }\n    if (Object.prototype.hasOwnProperty.call(data,\
          \ \"requestedCategories\")) {\n      const values = data.requestedCategories;\n\
          \      if (!Array.isArray(values) || values.length > 6 ||\n          values.some((value)\
          \ => !categories.includes(value)) || new Set(values).size !== values.length)\
          \ {\n        throw new Error(\"requestedCategories 必须是不重复的合法品类数组\");\n \
          \     }\n      if (values.length === 1 ? data.category !== values[0] : data.category\
          \ !== \"\") {\n        throw new Error(\"category 必须与尚待寻找的候选品类一致\");\n \
          \     }\n    }\n    return {\n      q: data.q.trim(),\n      category: data.category,\n\
          \      styleTags: data.styleTags.join(\",\"),\n      requirements: JSON.stringify(data)\n\
          \    };\n  }"
